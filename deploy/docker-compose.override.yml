# Local/dev overrides: published ports.
# Auto-merged when using compose files under deploy/.
# LLM_MODE comes from deploy/.env (compose.yml default is mock); set LLM_MODE=live for real LLM.

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    ports:
      - "8080:8080"

  web:
    ports:
      - "3000:3000"

  agent-runtime:
    ports:
      - "8001:8001"
