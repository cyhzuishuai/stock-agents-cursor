# Local/dev overrides: published ports + mock LLM.
# Auto-merged when using compose files under deploy/.

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    ports:
      - "8080:8080"

  web:
    ports:
      - "3000:3000"

  agent-runtime:
    ports:
      - "8001:8001"
    environment:
      LLM_MODE: mock
