# Full stack: postgres, redis, api, web, five agents.
# From repo root: docker compose -f deploy/docker-compose.yml up --build
# Local ports + LLM_MODE=mock come from docker-compose.override.yml

name: stock-agents

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  agent-data:
    build:
      context: ..
      dockerfile: services/agents/data/Dockerfile
    env_file:
      - ./.env
    environment:
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-alpaca}
    restart: unless-stopped

  agent-research:
    build:
      context: ..
      dockerfile: services/agents/research/Dockerfile
    env_file:
      - ./.env
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    restart: unless-stopped

  agent-decision:
    build:
      context: ..
      dockerfile: services/agents/decision/Dockerfile
    env_file:
      - ./.env
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    restart: unless-stopped

  agent-portfolio:
    build:
      context: ..
      dockerfile: services/agents/portfolio/Dockerfile
    env_file:
      - ./.env
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    restart: unless-stopped

  agent-risk:
    build:
      context: ..
      dockerfile: services/agents/risk/Dockerfile
    env_file:
      - ./.env
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    restart: unless-stopped

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: postgres://stock:stock@postgres:5432/stock?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AGENT_DATA_URL: http://agent-data:8001
      AGENT_RESEARCH_URL: http://agent-research:8002
      AGENT_DECISION_URL: http://agent-decision:8003
      AGENT_PORTFOLIO_URL: http://agent-portfolio:8004
      AGENT_RISK_URL: http://agent-risk:8005
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-data:
        condition: service_started
      agent-research:
        condition: service_started
      agent-decision:
        condition: service_started
      agent-portfolio:
        condition: service_started
      agent-risk:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
