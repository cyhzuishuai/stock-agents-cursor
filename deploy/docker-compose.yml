# Full stack: postgres, redis, api, web, agent-runtime.
# From repo root: docker compose -f deploy/docker-compose.yml up --build
# Local ports + LLM_MODE=mock come from docker-compose.override.yml

name: stock-agents

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  agent-runtime:
    build:
      context: ..
      dockerfile: services/agents/runtime/Dockerfile
    env_file:
      - ./.env
    environment:
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-alpaca}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      ALPACA_DATA_BASE_URL: ${ALPACA_DATA_BASE_URL:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      MAX_TOOL_ROUNDS_ANALYST: ${MAX_TOOL_ROUNDS_ANALYST:-8}
      MAX_TOOL_ROUNDS_PORTFOLIO: ${MAX_TOOL_ROUNDS_PORTFOLIO:-3}
      WATCHLIST: ${WATCHLIST:-}
    restart: unless-stopped

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: postgres://stock:stock@postgres:5432/stock?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AGENT_RUNTIME_URL: http://agent-runtime:8001
      WATCHLIST: ${WATCHLIST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-runtime:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
